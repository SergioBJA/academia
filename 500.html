<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error del Servidor | Yes Of Course!</title>
    <link rel="icon" type="image/png" href="/CertificadosAgenciaTributaria/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#1A365D',
                            red: '#E53E3E',
                            gray: '#718096'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 flex items-center justify-center p-6 font-['Outfit']">
    <div class="max-w-xl w-full bg-white rounded-3xl shadow-xl overflow-hidden text-center relative border border-slate-100">
        <!-- Decorativa roja -->
        <div class="h-4 w-full bg-slate-400"></div>
        <div class="p-10 md:p-14">
            <img src="/CertificadosAgenciaTributaria/logo.png" alt="Logo Academia" class="h-24 mx-auto object-contain mb-8 hover:scale-105 transition-transform" style="filter: grayscale(100%); opacity: 0.8;">
            
            <div class="inline-block px-4 py-1.5 rounded-full bg-slate-100 text-slate-500 font-bold text-sm tracking-widest uppercase mb-4">
                Error 500
            </div>
            
            <h1 class="text-4xl md:text-5xl font-black text-slate-700 mb-4 tracking-tight">Error Interno</h1>
            
            <p class="text-slate-500 text-lg mb-10 leading-relaxed font-medium">
                El servidor de la academia ha encontrado un problema de comunicación interno inesperado. Por favor, inténtalo de nuevo en unos minutos.
            </p>
            
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <button onclick="window.location.reload()" class="inline-flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 px-8 rounded-xl transition-all shadow-lg hover:-translate-y-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Reintentar
                </button>
                <a href="/" class="inline-flex items-center justify-center gap-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-4 px-8 rounded-xl transition-all">
                    Volver al Inicio
                </a>
            </div>
        </div>
    </div>
</body>
</html>
